services:
  app:
    build: ./app
    container_name: app
    restart: always
    expose:
      - 8000

    volumes:
      - type: bind
        source: ./app
        target: /app

      - type: bind
        source: ./volumes/media
        target: /volumes/media

      - type: bind
        source: ./volumes/assets
        target: /volumes/assets

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy



  nginx:
    build: ./nginx
    container_name: nginx
    restart: always
    ports:
      - 80:80

    depends_on:
      - app

    volumes:
      - type: bind
        source: ./volumes/media
        target: /volumes/media

      - type: bind
        source: ./volumes/assets
        target: /volumes/assets



  postgres:
    image: postgres:18
    container_name: postgres
    restart: always

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - type: bind
        source: ./volumes/dbdata
        target: /var/lib/postgresql


    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saeed_user -d saeed_db"]
      interval: 5s
      timeout: 5s
      retries: 5
